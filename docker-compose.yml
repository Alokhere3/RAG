services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be explicitly set}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      RAG_APP_PASSWORD: ${RAG_APP_PASSWORD:?RAG_APP_PASSWORD environment variable must be explicitly set}
      RAG_MIGRATOR_PASSWORD: ${RAG_MIGRATOR_PASSWORD:?RAG_MIGRATOR_PASSWORD environment variable must be explicitly set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
      - ./deployment/docker/postgres/02-init-roles.sh:/docker-entrypoint-initdb.d/02-init-roles.sh:ro
      - ./deployment/docker/postgres/init-roles.sql:/etc/postgresql/init-roles.sql:ro
      - ./deployment/docker/postgres/rotate-role-passwords.sh:/usr/local/bin/rotate-role-passwords.sh:ro
      - ./deployment/docker/postgres/rotate-role-passwords.sql:/etc/postgresql/rotate-role-passwords.sql:ro
      - ./deployment/docker/postgres/recover-initialization.sh:/usr/local/bin/recover-initialization.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: >-
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server;
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV environment variable must be explicitly set (e.g. development, staging, production)}
      APP_NAME: ${APP_NAME:-RAG Platform}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${RAG_APP_USER:-rag_app}:${RAG_APP_PASSWORD:?RAG_APP_PASSWORD environment variable must be explicitly set}@postgres:5432/${POSTGRES_DB:-rag}}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://${RAG_MIGRATOR_USER:-rag_migrator}:${RAG_MIGRATOR_PASSWORD:?RAG_MIGRATOR_PASSWORD environment variable must be explicitly set}@postgres:5432/${POSTGRES_DB:-rag}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Demo Organization}
      ORGANIZATION_LOGO_URL: ${ORGANIZATION_LOGO_URL:-}
      ORGANIZATION_WEBSITE_URL: ${ORGANIZATION_WEBSITE_URL:-}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-${BOT_NAME:-AI Assistant}}
      ASSISTANT_DESCRIPTION: ${ASSISTANT_DESCRIPTION:-Ask questions about your organization's knowledge.}
      ASSISTANT_AVATAR_URL: ${ASSISTANT_AVATAR_URL:-}
      BOT_NAME: ${BOT_NAME:-AI Assistant}
      PRIMARY_COLOR: ${PRIMARY_COLOR:-#2563EB}
      SECONDARY_COLOR: ${SECONDARY_COLOR:-#1E293B}
      ACCENT_COLOR: ${ACCENT_COLOR:-#3B82F6}
      FAVICON_URL: ${FAVICON_URL:-}
      ENABLE_CHAT: ${ENABLE_CHAT:-true}
      ENABLE_DOCUMENTS: ${ENABLE_DOCUMENTS:-true}
      ENABLE_INGESTION: ${ENABLE_INGESTION:-true}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      STORAGE_DIR: /app/data/storage
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    volumes:
      - storage_data:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.ingestion_worker"]
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV environment variable must be explicitly set (e.g. development, staging, production)}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${RAG_APP_USER:-rag_app}:${RAG_APP_PASSWORD:?RAG_APP_PASSWORD environment variable must be explicitly set}@postgres:5432/${POSTGRES_DB:-rag}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: /app/data/storage
      JWT_SECRET: ${JWT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
    volumes:
      - storage_data:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; exit(0)'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
