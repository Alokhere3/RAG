name: Security CI & Release Quality Gate

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-security-and-tests:
    name: Backend Security, Quality, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend dependencies from lockfile
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff mypy bandit pip-audit pytest pytest-asyncio pytest-cov

      - name: Run Ruff Linter
        working-directory: ./backend
        run: ruff check .

      - name: Run Bandit Security Scanner
        working-directory: ./backend
        run: bandit -r app/ -ll -ii

      - name: Run Dependency Vulnerability Audit (pip-audit)
        working-directory: ./backend
        run: pip-audit -r requirements.lock --ignore-vuln || true

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          APP_ENV: testing
          JWT_SECRET: ci-test-secret-minimum-32-characters-length-for-ci
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest --cov=app --cov-report=term-missing

  frontend-security-and-tests:
    name: Frontend Security and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run NPM Security Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test -- run

  docker-isolation-check:
    name: Build Context and Docker Isolation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for unit test
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest and pyyaml
        run: pip install pytest pyyaml

      - name: Verify Dockerignore isolation and Compose port bindings
        working-directory: ./backend
        run: |
          pytest tests/unit/test_dockerignore_isolation.py tests/unit/test_docker_compose_security.py -v
